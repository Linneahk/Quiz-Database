<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://owgldsfxpmzpkipgeksr.supabase.co wss://owgldsfxpmzpkipgeksr.supabase.co https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Stord Quiz – Logg inn</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Epilogue:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Boot-overlay: skjul login-skjemaet til vi veit om brukaren allereie er innlogga (då redirectar vi utan glimt) */
    body:not(.app-ready) > *:not(#boot){display:none !important;}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f0f13;z-index:9999;}
    body.app-ready #boot{display:none;}
    #boot .bspin{width:34px;height:34px;border:3px solid rgba(200,240,80,.2);border-top-color:#c8f050;border-radius:50%;animation:bspin .7s linear infinite;}
    @keyframes bspin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>

<div id="boot"><div class="bspin"></div></div>

<div class="card">

  <div class="logo">Stord Quiz</div>
  <div class="tagline">Administrasjonspanel</div>

  <div class="msg" id="msg"></div>

  <div id="loginForm">
    <div class="form">
      <div class="field">
        <label for="loginEmail">E-post</label>
        <input type="email" id="loginEmail" placeholder="admin@skule.no" />
      </div>
      <div class="field">
        <label for="loginPassword">Passord</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn" id="loginBtn" onclick="login()">Logg inn</button>
      <div class="forgot" onclick="forgotPassword()">Gløymt passord?</div>
    </div>
  </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
