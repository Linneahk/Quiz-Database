<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizApp – Logg inn</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Epilogue:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="card">

  <div class="logo">QuizApp</div>
  <div class="tagline">Administrasjonspanel</div>

  <div class="msg" id="msg"></div>

  <div id="loginForm">
    <div class="form">
      <div class="field">
        <label for="loginEmail">E-post</label>
        <input type="email" id="loginEmail" placeholder="admin@skule.no" />
      </div>
      <div class="field">
        <label for="loginPassword">Passord</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn" id="loginBtn" onclick="login()">Logg inn</button>
      <div class="forgot" onclick="forgotPassword()">Gløymt passord?</div>
    </div>
  </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
