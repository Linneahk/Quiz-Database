<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://owgldsfxpmzpkipgeksr.supabase.co wss://owgldsfxpmzpkipgeksr.supabase.co https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Stord Quiz – Host</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Epilogue:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/host.css">
</head>

<body>

  <!-- LOBBY -->
  <div id="lobby">
    <div id="lobby-loading" style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
      <div class="spinner"></div>
      <p style="color:var(--muted)">Laster quiz…</p>
    </div>
    <div id="lobby-content" class="hidden"
      style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:660px;">
      <div class="logo">Stord Quiz</div>
      <p style="color:var(--muted);margin-bottom:.25rem;">🗺️ Aktivitetsquiz</p>
      <h1 class="qname" id="qname">Quiz</h1>
      <p class="qsub" id="qsub"></p>
      <div class="pin-card">
        <div class="pin-lbl">Bli med på</div>
        <div class="pin-num" id="pin-num">––––––</div>
        <div class="pin-url" id="pin-url"></div>
      </div>
      <p class="join-hint">Elevar går til <strong id="join-strong"></strong> og skriv inn PIN-koden</p>
      <div class="pwrap" id="pwrap">
        <p style="color:var(--muted);font-size:.85rem;">Ventar på elevar…</p>
      </div>
      <p class="pcnt" id="pcnt">0 elevar tilkobla</p>
      <p class="rtstat" id="rtstat">⏳ Kobler til realtime…</p>
      <button class="btn-start" id="btn-start" onclick="startHunt()">🏃 Start jakt!</button>
      <button class="btn-cancel-session" onclick="cancelSession()">Avslutt økt</button>
    </div>
  </div>

  <!-- HUNT LIVE -->
  <div id="hunt">
    <div class="hunt-topbar">
      <span class="hunt-title" id="hunt-qname">Quiz</span>
      <div class="hunt-meta">
        <span class="hunt-qcount" id="hunt-qcount"></span>
        <span class="hunt-timer" id="hunt-timer">00:00</span>
        <button id="btn-pause" class="btn-end-hunt" onclick="togglePause()" style="background:var(--surface);border:1px solid var(--border);">⏸ Pause</button>
        <button class="btn-end-hunt" onclick="endHunt()">Avslutt jakt</button>
      </div>
    </div>
    <div class="hunt-body">
      <div class="lb-title">🏆 Direkteoversikt</div>
      <div class="lb-list" id="lb-list">
        <p style="color:var(--muted);font-size:.85rem;text-align:center;padding:.5rem;">Ventar på svar…</p>
      </div>
    </div>
  </div>

  <!-- FINAL RESULTS -->
  <div id="final">
    <p style="color:var(--muted);margin-bottom:.5rem;">🏆 Jakt ferdig!</p>
    <h1 class="final-title">Sluttresultat</h1>
    <p class="final-sub" id="final-sub"></p>
    <div class="final-lb" id="final-lb"></div>
    <button class="btn-back-dash" onclick="location.href='dashboard.html'">← Tilbake til dashboard</button>
  </div>

  <!-- CONFIRM MODAL -->
  <div id="confirm-modal" class="confirm-overlay">
    <div class="confirm-box">
      <p id="confirm-msg"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn-confirm-cancel">Avbryt</button>
        <button id="confirm-ok" class="btn-confirm-ok">Avslutt</button>
      </div>
    </div>
  </div>

  <script src="js/host.js" defer></script>
</body>

</html>
