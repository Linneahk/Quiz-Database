<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stord Quiz – Host</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Epilogue:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2a2a3a;
      --accent: #c8f050;
      --text: #f0f0f5;
      --muted: #7a7a9a;
      --red: #ff4d6d;
      --green: #50f0a0;
      --yellow: #f0c050;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Epilogue', sans-serif;
      min-height: 100vh;
    }

    /* ── LOBBY ── */
    #lobby {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .logo {
      font-family: 'Fraunces', serif;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }

    .qname {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 900;
      text-align: center;
      margin-bottom: .25rem;
    }

    .qsub {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 1.5rem;
    }

    .pin-card {
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: clamp(1.25rem, 4vw, 2rem) clamp(1.5rem, 6vw, 3.5rem);
      text-align: center;
      margin-bottom: 1rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 40px rgba(200, 240, 80, .1);
    }

    .pin-lbl {
      font-size: .75rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .25rem;
    }

    .pin-num {
      font-family: 'Fraunces', serif;
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      font-weight: 900;
      color: var(--accent);
      letter-spacing: .08em;
      line-height: 1;
    }

    .pin-url {
      color: var(--muted);
      font-size: .78rem;
      margin-top: .4rem;
      word-break: break-all;
    }

    .join-hint {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .join-hint strong {
      color: var(--text);
    }

    .pwrap {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      min-height: 52px;
      margin-bottom: .75rem;
    }

    .pchip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: .4rem 1rem;
      font-size: .88rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: .4rem;
      animation: pop .3s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes pop {
      from {
        transform: scale(.5);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .pdot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pcnt {
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: .25rem;
      text-align: center;
    }

    .rtstat {
      font-size: .72rem;
      color: var(--muted);
      margin-bottom: 1rem;
      text-align: center;
    }

    .btn-start {
      background: var(--accent);
      color: #0f0f13;
      border: none;
      border-radius: 14px;
      padding: .9rem 2.5rem;
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      width: 100%;
      max-width: 280px;
      box-shadow: 0 4px 20px rgba(200, 240, 80, .25);
    }

    .btn-start:hover {
      transform: translateY(-2px);
    }

    .btn-start:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
    }

    /* ── HUNT SCREEN ── */
    #hunt {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    .hunt-topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: clamp(.6rem, 2vw, .9rem) clamp(.75rem, 3vw, 1.25rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .5rem;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .hunt-title {
      font-family: 'Fraunces', serif;
      font-weight: 900;
      font-size: 1.1rem;
    }

    .hunt-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .hunt-timer {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
    }

    .hunt-qcount {
      font-size: .85rem;
      color: var(--muted);
    }

    .btn-end-hunt {
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: .5rem 1.25rem;
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
    }

    .hunt-body {
      padding: clamp(.75rem, 3vw, 1.25rem);
      flex: 1;
      overflow-y: auto;
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
    }

    /* Leaderboard */
    .lb-title {
      font-size: .8rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .75rem;
    }

    .lb-list {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      margin-bottom: 1.5rem;
    }

    .lb-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .8rem 1rem;
      transition: border-color .3s;
    }

    .lb-row.gold {
      border-color: var(--yellow);
    }

    .lb-row.silver {
      border-color: var(--muted);
    }

    .lb-row.bronze {
      border-color: #cd7f32;
    }

    .lb-rank {
      font-family: 'Fraunces', serif;
      font-weight: 900;
      font-size: 1.1rem;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }

    .lb-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .lb-name {
      flex: 1;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lb-progress {
      font-size: .8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .lb-score {
      font-family: 'Fraunces', serif;
      font-weight: 900;
      color: var(--accent);
      flex-shrink: 0;
    }

    .lb-time {
      font-size: .75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .lb-done-badge {
      background: #1a2a00;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: .15rem .5rem;
      font-size: .72rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* FINAL */
    #final {
      display: none;
      min-height: 100vh;
      padding: 1.5rem;
      flex-direction: column;
      align-items: center;
    }

    .final-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 900;
      margin-bottom: .5rem;
      text-align: center;
    }

    .final-sub {
      color: var(--muted);
      margin-bottom: 2rem;
      text-align: center;
    }

    .final-lb {
      width: 100%;
      max-width: 600px;
    }

    .final-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .9rem 1.25rem;
      margin-bottom: .6rem;
      animation: slide .4s ease both;
    }

    .final-row:nth-child(1) {
      border-color: var(--yellow);
    }

    .final-row:nth-child(2) {
      border-color: var(--muted);
    }

    .final-row:nth-child(3) {
      border-color: #cd7f32;
    }

    @keyframes slide {
      from {
        transform: translateX(-20px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .btn-back-dash {
      margin-top: 1.5rem;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .8rem 2rem;
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .7rem 1.25rem;
      font-size: .9rem;
      z-index: 999;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }

    @media(max-width:600px) {
      .hunt-title {
        font-size: .9rem;
      }

      .hunt-timer {
        font-size: .9rem;
      }

      .hunt-qcount {
        display: none;
      }

      .lb-row {
        padding: .6rem .75rem;
        gap: .5rem;
      }

      .lb-time {
        display: none;
      }

      .pin-num {
        font-size: clamp(2rem, 12vw, 4rem);
      }

      #lobby {
        padding: 1rem;
      }
    }

    @media(max-width:400px) {
      .lb-progress {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- LOBBY -->
  <div id="lobby">
    <div id="lobby-loading" style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
      <div class="spinner"></div>
      <p style="color:var(--muted)">Laster quiz…</p>
    </div>
    <div id="lobby-content" class="hidden"
      style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:660px;">
      <div class="logo">Stord Quiz</div>
      <p style="color:var(--muted);margin-bottom:.25rem;">🗺️ Aktivitetsquiz</p>
      <h1 class="qname" id="qname">Quiz</h1>
      <p class="qsub" id="qsub"></p>
      <div class="pin-card">
        <div class="pin-lbl">Bli med på</div>
        <div class="pin-num" id="pin-num">––––––</div>
        <div class="pin-url" id="pin-url"></div>
      </div>
      <p class="join-hint">Elevar går til <strong id="join-strong"></strong> og skriv inn PIN-koden</p>
      <div class="pwrap" id="pwrap">
        <p style="color:var(--muted);font-size:.85rem;">Ventar på elevar…</p>
      </div>
      <p class="pcnt" id="pcnt">0 elevar tilkobla</p>
      <p class="rtstat" id="rtstat">⏳ Kobler til realtime…</p>
      <button class="btn-start" id="btn-start" onclick="startHunt()">🏃 Start jakt!</button>
      <button class="btn-cancel-session" onclick="cancelSession()"
        style="margin-top:.75rem;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:10px;padding:.5rem 1.5rem;font-family:'Fraunces',serif;font-weight:700;font-size:.85rem;cursor:pointer;">Avslutt
        økt</button>
    </div>
  </div>

  <!-- HUNT LIVE -->
  <div id="hunt">
    <div class="hunt-topbar">
      <span class="hunt-title" id="hunt-qname">Quiz</span>
      <div class="hunt-meta">
        <span class="hunt-qcount" id="hunt-qcount"></span>
        <span class="hunt-timer" id="hunt-timer">00:00</span>
        <button id="btn-pause" class="btn-end-hunt" onclick="togglePause()" style="background:var(--surface);border:1px solid var(--border);">⏸ Pause</button>
        <button class="btn-end-hunt" onclick="endHunt()">Avslutt jakt</button>
      </div>
    </div>
    <div class="hunt-body">
      <div class="lb-title">🏆 Direkteoversikt</div>
      <div class="lb-list" id="lb-list">
        <p style="color:var(--muted);font-size:.85rem;text-align:center;padding:.5rem;">Ventar på svar…</p>
      </div>
    </div>
  </div>

  <!-- FINAL RESULTS -->
  <div id="final">
    <p style="color:var(--muted);margin-bottom:.5rem;">🏆 Jakt ferdig!</p>
    <h1 class="final-title">Sluttresultat</h1>
    <p class="final-sub" id="final-sub"></p>
    <div class="final-lb" id="final-lb"></div>
    <button class="btn-back-dash" onclick="location.href='dashboard.html'">← Tilbake til dashboard</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://owgldsfxpmzpkipgeksr.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93Z2xkc2Z4cG16cGtpcGdla3NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MDM2NTYsImV4cCI6MjA5MjM3OTY1Nn0.bD5dNHcQfjjq29DprTnVafxuZeCvt30zu0qQItq6AXY'
    const { createClient } = supabase
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

    const quizId = new URLSearchParams(location.search).get('quiz')
    let sessionId = null, players = [], totalQs = 0, channel = null
    let huntStartTime = null, timerInt = null, quizName = ''
    let isPaused = false, pausedAt = null, totalPausedMs = 0

    async function init() {
      if (!quizId) { toast('Ingen quiz vald'); return }
      const { data: { user } } = await sb.auth.getUser()
      if (!user) { location.href = 'login.html'; return }

      const { data: quiz, error: qe } = await sb.from('quizzes').select('*').eq('id', quizId).single()
      if (qe || !quiz) { toast('Fann ikkje quizen'); return }
      quizName = quiz.name

      const { data: qs } = await sb.from('questions').select('id').eq('major_id', quizId)
      totalQs = qs?.length || 0

      // Find existing non-finished session (URL param → DB lookup → create new)
      const urlSessionId = new URLSearchParams(location.search).get('session')
      let existingSess = null

      if (urlSessionId) {
        const { data } = await sb.from('sessions').select('*').eq('id', urlSessionId).single()
        existingSess = data
      }
      // Check localStorage for a session we created before
      if (!existingSess) {
        const storedId = localStorage.getItem('host_session_' + quizId)
        if (storedId) {
          const { data } = await sb.from('sessions')
            .select('*').eq('id', storedId).in('status', ['waiting', 'active']).maybeSingle()
          existingSess = data
        }
      }
      if (existingSess) {
        sessionId = existingSess.id
        const { data: ep } = await sb.from('session_players').select('*').eq('session_id', sessionId)
        players = ep || []
        showLobby(quiz, existingSess.join_code)
        setupRealtime()
        if (existingSess.status === 'active') {
          huntStartTime = existingSess.started_at ? new Date(existingSess.started_at).getTime() : Date.now()
          isPaused = existingSess.is_paused || false
          totalPausedMs = existingSess.total_paused_ms || 0
          pausedAt = existingSess.paused_at ? new Date(existingSess.paused_at).getTime() : null
          document.getElementById('lobby').style.display = 'none'
          const huntEl = document.getElementById('hunt'); huntEl.style.display = 'flex'
          document.getElementById('hunt-qname').textContent = quizName
          document.getElementById('hunt-qcount').textContent = `${totalQs} spørsmål`
          updatePauseBtn()
          if (!isPaused) startTimer()
          await refreshLeaderboard()
        }
        return
      }

      // No existing session — create new
      const pin = String(Math.floor(100000 + Math.random() * 900000))
      const { data: sess, error: se } = await sb.from('sessions').insert({
        quiz_id: quizId, join_code: pin, status: 'waiting', host_id: user.id
      }).select().single()
      if (se) { toast('Kunne ikkje opprette økt: ' + se.message); console.error(se); return }
      sessionId = sess.id
      localStorage.setItem('host_session_' + quizId, sess.id)
      await sb.from('quizzes').update({ session_count: (quiz.session_count || 0) + 1 }).eq('id', quizId)
      showLobby(quiz, pin)
      setupRealtime()
    }

    function showLobby(quiz, pin) {
      document.getElementById('lobby-loading').style.display = 'none'
      const lc = document.getElementById('lobby-content'); lc.classList.remove('hidden'); lc.style.display = 'flex'
      document.getElementById('qname').textContent = quiz.name
      document.getElementById('qsub').textContent = `${totalQs} spørsmål`
      document.getElementById('pin-num').textContent = pin
      const base = location.origin + location.pathname.replace('host.html', '')
      document.getElementById('pin-url').textContent = base
      document.getElementById('join-strong').textContent = base
      renderLobbyPlayers()
      // Poll player list every 3s as reliable fallback for join/leave
      if (window._lobbyPoll) clearInterval(window._lobbyPoll)
      window._lobbyPoll = setInterval(async () => {
        const { data: fresh } = await sb.from('session_players').select('*').eq('session_id', sessionId).eq('is_active', true)
        if (fresh) { players = fresh; renderLobbyPlayers() }
      }, 3000)
    }

    function setupRealtime() {
      channel = sb.channel('session:' + sessionId)
      channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'session_players', filter: `session_id=eq.${sessionId}` }, (p) => {
        players.push(p.new); renderLobbyPlayers()
      })
      channel.on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'session_players', filter: `session_id=eq.${sessionId}` }, async () => {
        const { data: fresh } = await sb.from('session_players').select('*').eq('session_id', sessionId).eq('is_active', true)
        players = fresh || []
        renderLobbyPlayers()
        refreshLeaderboard()
      })
      channel.on('broadcast', { event: 'player_left' }, async () => {
        const { data: fresh } = await sb.from('session_players').select('*').eq('session_id', sessionId).eq('is_active', true)
        players = fresh || []
        renderLobbyPlayers()
        refreshLeaderboard()
      })
      channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'session_answers', filter: `session_id=eq.${sessionId}` }, () => {
        refreshLeaderboard()
      })
      channel.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'session_players', filter: `session_id=eq.${sessionId}` }, (p) => {
        const idx = players.findIndex(x => x.id === p.new.id)
        if (idx >= 0) players[idx] = p.new; else players.push(p.new)
        refreshLeaderboard()
      })
      channel.subscribe((status, err) => {
        const el = document.getElementById('rtstat')
        if (status === 'SUBSCRIBED') { el.textContent = '🟢 Realtime tilkobla'; el.style.color = 'var(--accent)' }
        else if (status === 'CHANNEL_ERROR') { el.textContent = '🔴 Realtime feil'; el.style.color = 'var(--red)'; console.error(err) }
      })
    }

    function renderLobbyPlayers() {
      const w = document.getElementById('pwrap')
      w.innerHTML = players.length === 0
        ? '<p style="color:var(--muted);font-size:.85rem;">Ventar på elevar…</p>'
        : players.map(p => `<div class="pchip"><div class="pdot" style="background:${p.avatar_color}"></div>${p.nickname}</div>`).join('')
      document.getElementById('pcnt').textContent = `${players.length} elev${players.length !== 1 ? 'ar' : ''} tilkobla`
    }

    window.startHunt = async function () {
      if (players.length === 0) return toast('Ingen elevar enno!')
      if (totalQs === 0) return toast('Quizen har ingen spørsmål!')

      huntStartTime = Date.now()
      isPaused = false; pausedAt = null; totalPausedMs = 0
      const { error: startErr } = await sb.from('sessions')
        .update({ status: 'active', started_at: new Date().toISOString(), is_paused: false, total_paused_ms: 0 })
        .eq('id', sessionId)
      if (startErr) {
        console.error('Could not start session:', startErr)
        toast('Feil ved start: ' + startErr.message)
        return
      }
      await channel.send({ type: 'broadcast', event: 'game_start', payload: { session_id: sessionId } })

      if (window._lobbyPoll) { clearInterval(window._lobbyPoll); window._lobbyPoll = null }
      document.getElementById('lobby').style.display = 'none'
      const huntEl = document.getElementById('hunt'); huntEl.style.display = 'flex'
      document.getElementById('hunt-qname').textContent = quizName
      document.getElementById('hunt-qcount').textContent = `${totalQs} spørsmål`

      updatePauseBtn()
      startTimer()
      await refreshLeaderboard()
    }

    function startTimer() {
      clearInterval(timerInt)
      timerInt = setInterval(() => {
        const elapsed = Math.floor((Date.now() - huntStartTime - totalPausedMs) / 1000)
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0')
        const s = String(elapsed % 60).padStart(2, '0')
        const el = document.getElementById('hunt-timer')
        if (el) el.textContent = `${m}:${s}`
      }, 1000)
    }

    function updatePauseBtn() {
      const btn = document.getElementById('btn-pause')
      if (!btn) return
      if (isPaused) {
        btn.textContent = '▶ Fortsett'
        btn.style.background = 'var(--green)'
        btn.style.color = '#0f0f13'
        document.getElementById('hunt-timer').style.opacity = '0.5'
      } else {
        btn.textContent = '⏸ Pause'
        btn.style.background = ''
        btn.style.color = ''
        document.getElementById('hunt-timer').style.opacity = '1'
      }
    }

    window.togglePause = async function () {
      if (!isPaused) {
        // PAUSE
        clearInterval(timerInt)
        isPaused = true
        pausedAt = Date.now()
        updatePauseBtn()
        await sb.from('sessions').update({ is_paused: true, paused_at: new Date(pausedAt).toISOString() }).eq('id', sessionId)
        await channel.send({ type: 'broadcast', event: 'timer_pause', payload: {} })
        toast('⏸ Tidtakar pause')
      } else {
        // RESUME
        const pausedDuration = Date.now() - pausedAt
        totalPausedMs += pausedDuration
        isPaused = false
        pausedAt = null
        updatePauseBtn()
        await sb.from('sessions').update({ is_paused: false, paused_at: null, total_paused_ms: totalPausedMs }).eq('id', sessionId)
        await channel.send({ type: 'broadcast', event: 'timer_resume', payload: { total_paused_ms: totalPausedMs } })
        startTimer()
        toast('▶ Tidtakar starta')
      }
    }

    async function refreshLeaderboard() {
      // Fetch latest player scores and answer counts
      const { data: playerData } = await sb
        .from('session_players')
        .select('id, nickname, avatar_color, total_score, hunt_finished_at')
        .eq('session_id', sessionId)
        .eq('is_active', true)

      // Fetch answer counts per player
      const { data: answerCounts } = await sb
        .from('session_answers')
        .select('player_id')
        .eq('session_id', sessionId)

      const countMap = {}
        ; (answerCounts || []).forEach(a => { countMap[a.player_id] = (countMap[a.player_id] || 0) + 1 })

      // Sort: by score desc, then by finish time asc (tiebreak), then by answer count desc
      const sorted = (playerData || []).sort((a, b) => {
        if (b.total_score !== a.total_score) return b.total_score - a.total_score
        // Tiebreak: finished faster wins
        if (a.hunt_finished_at && b.hunt_finished_at) return new Date(a.hunt_finished_at) - new Date(b.hunt_finished_at)
        if (a.hunt_finished_at) return -1
        if (b.hunt_finished_at) return 1
        return (countMap[b.id] || 0) - (countMap[a.id] || 0)
      })

      players = sorted
      const MEDALS = ['🥇', '🥈', '🥉']
      const RANK_CLS = ['gold', 'silver', 'bronze']

      document.getElementById('lb-list').innerHTML = sorted.length === 0
        ? '<p style="color:var(--muted);font-size:.85rem;text-align:center;padding:.5rem;">Ventar på svar…</p>'
        : sorted.map((p, i) => {
          const answered = countMap[p.id] || 0
          const done = p.hunt_finished_at
          const timeStr = done && huntStartTime ? formatTime(new Date(p.hunt_finished_at) - huntStartTime) : ''
          return `
          <div class="lb-row ${RANK_CLS[i] || ''}">
            <span class="lb-rank">${MEDALS[i] || i + 1}</span>
            <div class="lb-dot" style="background:${p.avatar_color}"></div>
            <span class="lb-name">${p.nickname}</span>
            <span class="lb-progress">${answered}/${totalQs}</span>
            ${done ? `<span class="lb-done-badge">✓ Ferdig</span>` : ''}
            ${timeStr ? `<span class="lb-time">${timeStr}</span>` : ''}
            <span class="lb-score">${p.total_score}</span>
          </div>`
        }).join('')
    }

    function formatTime(ms) {
      const s = Math.floor(ms / 1000)
      return `${Math.floor(s / 60)}m ${s % 60}s`
    }

    window.endHunt = async function () {
      clearInterval(timerInt)
      await sb.from('sessions').update({ status: 'finished', ended_at: new Date().toISOString() }).eq('id', sessionId)
      localStorage.removeItem('host_session_' + quizId)
      await channel.send({ type: 'broadcast', event: 'game_over', payload: {} })
      await showFinal()
    }

    async function showFinal() {
      // Always fetch fresh scores from DB — local players array may be stale
      const [{ data: freshPlayers }, { data: answerCounts }] = await Promise.all([
        sb.from('session_players')
          .select('id, nickname, avatar_color, total_score, hunt_finished_at')
          .eq('session_id', sessionId),
        sb.from('session_answers').select('player_id').eq('session_id', sessionId)
      ])

      const countMap = {}
      ;(answerCounts || []).forEach(a => { countMap[a.player_id] = (countMap[a.player_id] || 0) + 1 })

      const sorted = (freshPlayers || []).sort((a, b) => {
        if (b.total_score !== a.total_score) return b.total_score - a.total_score
        if (a.hunt_finished_at && b.hunt_finished_at) return new Date(a.hunt_finished_at) - new Date(b.hunt_finished_at)
        if (a.hunt_finished_at) return -1
        if (b.hunt_finished_at) return 1
        return 0
      })

      document.getElementById('hunt').style.display = 'none'
      const finalEl = document.getElementById('final'); finalEl.style.display = 'flex'
      document.getElementById('final-sub').textContent = `${sorted.length} elevar • ${totalQs} spørsmål`

      const MEDALS = ['🥇', '🥈', '🥉']
      document.getElementById('final-lb').innerHTML = sorted.map((p, i) => {
        const answered = countMap[p.id] || 0
        const timeStr = p.hunt_finished_at && huntStartTime ? formatTime(new Date(p.hunt_finished_at) - huntStartTime) : '–'
        return `
      <div class="final-row" style="animation-delay:${i * .08}s">
        <span class="lb-rank">${MEDALS[i] || i + 1}</span>
        <div class="lb-dot" style="background:${p.avatar_color}"></div>
        <span class="lb-name">${p.nickname}</span>
        <span class="lb-progress" style="font-size:.8rem;color:var(--muted)">${answered}/${totalQs} svar</span>
        <span class="lb-time" style="font-size:.8rem;color:var(--muted)">${timeStr}</span>
        <span class="lb-score">${p.total_score}</span>
      </div>`
      }).join('')
    }

    function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000) }

    window.cancelSession = async function () {
      if (!confirm('Vil du avslutte denne økta? Elevar som er med vil bli kasta ut.')) return
      if (sessionId) {
        await sb.from('sessions').update({ status: 'finished', ended_at: new Date().toISOString() }).eq('id', sessionId)
        localStorage.removeItem('host_session_' + quizId)
        await channel?.send({ type: 'broadcast', event: 'game_over', payload: {} })
      }
      location.href = 'dashboard.html'
    }

    init()
  </script>
</body>
