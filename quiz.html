<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stord Quiz – Rediger quiz</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Epilogue:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body class="dashboard-body">

  <!-- TOPBAR -->
  <header class="topbar">
    <a href="dashboard.html" class="topbar-logo">Stord Quiz</a>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="userInitial">?</div>
        <span id="userEmail">…</span>
      </div>
      <button class="logout-btn" onclick="logout()">Logg ut</button>
    </div>
  </header>

  <!-- EDITOR -->
  <div class="editor-wrap">
    <div class="editor-header">
      <div>
        <a class="back-link" href="dashboard.html">← Tilbake til dashboard</a>
        <div class="editor-title" id="quizTitle">Lastar <span>quiz</span>…</div>
        <div class="editor-subtitle">Legg til spørsmål og generer QR-kodar</div>
      </div>
      <div class="header-actions">
        <button class="btn-pdf" onclick="downloadPDF()">Last ned PDF</button>
        <button class="btn-add" onclick="addQuestion()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Nytt spørsmål
        </button>
      </div>
    </div>

    <!-- TIDSPLAN-BAR -->
    <div id="scheduleBar" style="margin:0 0 1.25rem;padding:.75rem 1rem;background:var(--surface,#1a1a24);border:1px solid var(--border,#2a2a3a);border-radius:12px;display:flex;align-items:center;flex-wrap:wrap;gap:.6rem;">
      <span style="font-size:.85rem;color:var(--muted,#7a7a9a);white-space:nowrap;">📅 Tidsplan:</span>
      <div id="scheduleDisplay" style="flex:1;display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;">
        <!-- filled by JS -->
      </div>
      <button id="scheduleEditBtn" onclick="openScheduleEdit()" style="font-size:.8rem;padding:.3rem .75rem;border-radius:8px;border:1px solid var(--border,#2a2a3a);background:transparent;color:var(--muted,#7a7a9a);cursor:pointer;">✏️ Endre</button>
    </div>
    <!-- TIDSPLAN REDIGERINGSPANEL -->
    <div id="scheduleEditPanel" style="display:none;margin:-0.5rem 0 1.25rem;padding:1rem;background:var(--surface,#1a1a24);border:1px solid var(--accent,#c8f050);border-radius:12px;">
      <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem;">
        <div style="flex:1;min-width:160px;">
          <label style="font-size:.78rem;color:var(--muted,#7a7a9a);margin-bottom:.3rem;display:block;">Start</label>
          <input type="datetime-local" id="scheduleStartEdit" style="width:100%;padding:.45rem .6rem;border-radius:8px;border:1px solid var(--border,#2a2a3a);background:var(--bg,#0f0f13);color:var(--text,#f0f0f5);font-size:.88rem;" />
        </div>
        <div style="flex:1;min-width:160px;">
          <label style="font-size:.78rem;color:var(--muted,#7a7a9a);margin-bottom:.3rem;display:block;">Slutt <span style="opacity:.6">(valfritt)</span></label>
          <input type="datetime-local" id="scheduleEndEdit" style="width:100%;padding:.45rem .6rem;border-radius:8px;border:1px solid var(--border,#2a2a3a);background:var(--bg,#0f0f13);color:var(--text,#f0f0f5);font-size:.88rem;" />
        </div>
      </div>
      <div style="display:flex;gap:.5rem;">
        <button onclick="saveSchedule()" style="padding:.4rem 1rem;border-radius:8px;background:var(--accent,#c8f050);color:#111;font-weight:700;border:none;cursor:pointer;font-size:.85rem;">Lagre</button>
        <button onclick="clearSchedule()" style="padding:.4rem 1rem;border-radius:8px;background:transparent;border:1px solid var(--red,#ff4d6d);color:var(--red,#ff4d6d);cursor:pointer;font-size:.85rem;">Fjern tidsplan</button>
        <button onclick="closeScheduleEdit()" style="padding:.4rem 1rem;border-radius:8px;background:transparent;border:1px solid var(--border,#2a2a3a);color:var(--muted,#7a7a9a);cursor:pointer;font-size:.85rem;">Avbryt</button>
      </div>
    </div>

    <div class="q-list" id="qList">
      <div class="empty-qs">
        <div class="empty-icon">📝</div>
        <div class="empty-title">Ingen spørsmål enno</div>
        <div class="empty-desc">Trykk «Nytt spørsmål» for å kome i gang.</div>
      </div>
    </div>
  </div>

  <!-- PRINT AREA (usynleg på skjerm) -->
  <div id="printArea" style="display:none"></div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="js/quiz.js"></script>
</body>
</html>
