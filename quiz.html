<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://owgldsfxpmzpkipgeksr.supabase.co wss://owgldsfxpmzpkipgeksr.supabase.co https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Stord Quiz – Rediger quiz</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Epilogue:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/quiz.css">
  <style>
    /* Boot-overlay: skjul sida til auth er sjekka (hindrar glimt av editoren før evt. redirect til login) */
    body:not(.app-ready) > *:not(#boot){display:none !important;}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f0f13;z-index:9999;}
    body.app-ready #boot{display:none;}
    #boot .bspin{width:34px;height:34px;border:3px solid rgba(200,240,80,.2);border-top-color:#c8f050;border-radius:50%;animation:bspin .7s linear infinite;}
    @keyframes bspin{to{transform:rotate(360deg);}}
  </style>
</head>
<body class="dashboard-body">

  <div id="boot"><div class="bspin"></div></div>

  <!-- TOPBAR -->
  <header class="topbar">
    <a href="dashboard.html" class="topbar-logo">Stord Quiz</a>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="userInitial">?</div>
        <span id="userEmail">…</span>
      </div>
      <button class="logout-btn" onclick="logout()">Logg ut</button>
    </div>
  </header>

  <!-- EDITOR -->
  <div class="editor-wrap">
    <div class="editor-header">
      <div>
        <a class="back-link" href="dashboard.html">← Tilbake til dashboard</a>
        <div class="editor-title" id="quizTitle">Lastar <span>quiz</span>…</div>
        <div class="editor-subtitle">Legg til spørsmål og generer QR-kodar</div>
      </div>
      <div class="header-actions">
        <button class="btn-pdf" onclick="downloadPDF()">Last ned PDF</button>
        <button class="btn-add" onclick="addQuestion()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Nytt spørsmål
        </button>
      </div>
    </div>

    <!-- TIDSPLAN-BAR -->
    <div id="scheduleBar" style="margin:0 0 1.25rem;padding:.75rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;flex-wrap:wrap;gap:.6rem;">
      <span style="font-size:.85rem;color:var(--muted);white-space:nowrap;">📅 Tidsplan:</span>
      <div id="scheduleDisplay" style="flex:1;display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;">
        <!-- filled by JS -->
      </div>
      <button id="scheduleEditBtn" onclick="openScheduleEdit()" style="font-size:.8rem;padding:.3rem .75rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;">✏️ Endre</button>
    </div>
    <!-- TIDSPLAN REDIGERINGSPANEL -->
    <div id="scheduleEditPanel" style="display:none;margin:-0.5rem 0 1.25rem;padding:1rem;background:var(--card);border:1px solid var(--ink);border-radius:14px;">
      <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem;">
        <div style="flex:1;min-width:160px;">
          <label style="font-size:.78rem;color:var(--muted);margin-bottom:.3rem;display:block;">Start</label>
          <input type="datetime-local" id="scheduleStartEdit" style="width:100%;padding:.45rem .6rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:.88rem;font-family:inherit;" />
        </div>
        <div style="flex:1;min-width:160px;">
          <label style="font-size:.78rem;color:var(--muted);margin-bottom:.3rem;display:block;">Slutt <span style="opacity:.6">(valfritt)</span></label>
          <input type="datetime-local" id="scheduleEndEdit" style="width:100%;padding:.45rem .6rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:.88rem;font-family:inherit;" />
        </div>
      </div>
      <div style="display:flex;gap:.5rem;">
        <button onclick="saveSchedule()" style="padding:.4rem 1rem;border-radius:8px;background:var(--ink);color:var(--lime);font-weight:700;border:none;cursor:pointer;font-size:.85rem;font-family:inherit;">Lagre</button>
        <button onclick="clearSchedule()" style="padding:.4rem 1rem;border-radius:8px;background:transparent;border:1px solid var(--error);color:var(--error);cursor:pointer;font-size:.85rem;font-family:inherit;">Fjern tidsplan</button>
        <button onclick="closeScheduleEdit()" style="padding:.4rem 1rem;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.85rem;font-family:inherit;">Avbryt</button>
      </div>
    </div>

    <div class="q-list" id="qList">
      <div class="empty-qs">
        <div class="empty-icon">📝</div>
        <div class="empty-title">Ingen spørsmål enno</div>
        <div class="empty-desc">Trykk «Nytt spørsmål» for å kome i gang.</div>
      </div>
    </div>
  </div>

  <!-- PRINT AREA (usynleg på skjerm) -->
  <div id="printArea" style="display:none"></div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="js/quiz.js"></script>
</body>
</html>
