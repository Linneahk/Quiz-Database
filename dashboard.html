<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizApp – Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- QR-kode-generator (for å lage QR frå dashboard) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Epilogue:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-logo">QuizApp</div>
    <div class="topbar-right">
      <!-- QR-skann-knapp -->
      <a href="QR-scan.html" class="qr-scan-btn" title="Skann QR-kode">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <path d="M14 14h2v2h-2zM18 14h3M14 18h2M18 18h3M14 22h3M18 22h2"/>
        </svg>
        <span>Skann QR</span>
      </a>
      <div class="user-chip">
        <div class="user-avatar" id="userInitial">?</div>
        <span id="userEmail">…</span>
      </div>
      <button class="logout-btn" onclick="logout()">Logg ut</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <div class="page-header">
      <div>
        <div class="page-title">Mine <span>quizzar</span></div>
        <div class="page-subtitle">Opprett og administrer rebusløp og spørsmålsrunder</div>
      </div>
      <button class="btn-create" onclick="openModal()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Ny quiz
      </button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Totalt</div>
        <div class="stat-value" id="statTotal">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Aktive</div>
        <div class="stat-value" id="statActive">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Kladdar</div>
        <div class="stat-value" id="statDraft">–</div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title">Alle quizzar</div>
      <input class="search-input" type="search" placeholder="Søk…" oninput="filterQuizzes(this.value)" />
    </div>

    <div class="quiz-grid" id="quizGrid">
      <div class="loading-row"><div class="spinner"></div></div>
    </div>

  </main>

  <!-- OPPRETT QUIZ MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalIfBg(event)">
    <div class="modal">
      <div class="modal-title">Ny quiz</div>
      <div class="modal-desc">Gje quizen eit namn og eit ikon – du legg til spørsmål etterpå.</div>
      <div class="modal-form">
        <div class="modal-field">
          <label>Namn</label>
          <input type="text" id="newName" placeholder="t.d. Norgesgeografi 6B" maxlength="60" />
        </div>
        <div class="modal-field">
          <label>Ikon</label>
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Avbryt</button>
          <button class="btn-submit" id="submitBtn" onclick="createQuiz()">Opprett quiz</button>
        </div>
      </div>
    </div>
  </div>

  <!-- QR MODAL -->
  <div class="modal-overlay" id="qrModalOverlay" onclick="closeQrModalIfBg(event)">
    <div class="modal qr-modal">
      <div class="modal-title" id="qrModalTitle">QR-kode</div>
      <div class="modal-desc">Del denne QR-koden med elevane – dei skannar for å kome til quizen</div>
      <div class="qr-canvas-wrap">
        <canvas id="qrCanvas"></canvas>
      </div>
      <div class="qr-url" id="qrUrl"></div>
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn-cancel" onclick="closeQrModal()">Lukk</button>
        <button class="btn-submit" onclick="downloadQr()">📥 Last ned</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="js/dashboard.js"></script>
</body>
</html>
